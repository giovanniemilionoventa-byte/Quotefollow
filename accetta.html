<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F2ECDD">
<title>Preventivo — QuoteFollow</title>
<style>
:root{
  --bg:#F2ECDD; --surface:#FFFFFF; --hairline:rgba(28,24,21,.07);
  --text:#1C1815; --muted:#8A7F72; --muted-light:#B3A896;
  --primary:#7A3B47; --primary-dark:#5F2E38; --primary-tint:#F7E9EB; --on-primary:#FFFFFF;
  --accent-tint:#EAF1EA; --accent:#5B7A5D;
  --warn:#B8935A; --warn-tint:#F7EEDF;
  --danger:#A84A38; --danger-tint:#F8E9E5;
  --font-display:Georgia,'Noto Serif','Times New Roman',serif;
  --radius-lg:26px; --radius:22px; --radius-sm:16px; --radius-pill:999px;
  --shadow-card:0 14px 28px -12px rgba(28,24,21,.16), 0 2px 5px rgba(28,24,21,.04);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;min-height:100vh;padding:30px 18px;-webkit-font-smoothing:antialiased}
.wrap{max-width:460px;width:100%;margin:0 auto}
.brand{display:flex;align-items:center;gap:9px;margin-bottom:22px}
.brand .q{width:30px;height:30px;border-radius:10px;background:var(--primary-tint);color:var(--primary);font-family:var(--font-display);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center}
.brand b{font-size:14.5px;font-weight:700;color:var(--muted)}
.card{background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);padding:22px}
.card+.card{margin-top:14px}
h1{font-family:var(--font-display);font-size:23px;font-weight:700;margin-bottom:2px;line-height:1.28}
.sub{color:var(--muted);font-size:13.5px;margin-bottom:8px;font-weight:500}
.sub b{color:var(--text)}
.amount{font-family:var(--font-display);font-size:38px;font-weight:700;margin:12px 0}
.rows{display:grid;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--hairline);font-size:13.5px}
.rows .r{display:flex;justify-content:space-between;gap:10px}
.rows .k{color:var(--muted-light);font-weight:600}
.rows .r span:last-child{font-weight:600}
.question{font-size:15px;font-weight:700;font-family:var(--font-display);margin-bottom:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:var(--radius-pill);font-size:15px;font-weight:700;border:none;margin-top:10px;cursor:pointer;font-family:inherit}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-outline{background:var(--bg);color:var(--text)}
.btn-ghost{background:var(--danger-tint);color:var(--danger)}
.btn[disabled]{opacity:.5;pointer-events:none}
textarea{width:100%;margin-top:10px;padding:12px 14px;border:none;border-radius:var(--radius-sm);font:inherit;font-size:13.5px;resize:vertical;min-height:64px;background:var(--bg)}
textarea:focus{outline:none;box-shadow:0 0 0 2px var(--primary-tint)}
.alert{border-radius:var(--radius-sm);padding:13px 15px;font-size:13.5px;font-weight:500}
.alert-info{background:var(--primary-tint);color:var(--primary-dark)}
.alert-ok{background:var(--accent-tint);color:#3f5a41}
.alert-warn{background:var(--warn-tint);color:var(--warn)}
.alert-danger{background:var(--danger-tint);color:var(--danger);margin-top:10px}
.center{text-align:center;color:var(--muted);padding:26px 0;font-size:13.5px}
.note-label{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:18px;display:block}
.foot{text-align:center;color:var(--muted-light);font-size:11.5px;margin-top:20px;font-weight:500}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><div class="q">Q</div><b>QuoteFollow</b></div>
  <div id="app"><div class="card"><div class="center">Caricamento…</div></div></div>
  <div class="foot">Pagina di risposta al preventivo — nessun account richiesto.</div>
</div>

<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore-compat.js"></script>
<script>
'use strict';
const firebaseConfig={
  apiKey:"AIzaSyAXcrwKxlz-gaBP9HTekjPEGf0qKgvw5_8",
  authDomain:"quotefollow-13290.firebaseapp.com",
  projectId:"quotefollow-13290",
  storageBucket:"quotefollow-13290.firebasestorage.app",
  messagingSenderId:"261961670046",
  appId:"1:261961670046:web:93a0af99115463348fca8f"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

const token=new URLSearchParams(location.search).get('t');
const app=document.getElementById('app');

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fmtMoney(n){
  const v=Number(n)||0;
  const whole=Math.floor(v);
  const cents=Math.round((v-whole)*100);
  const w=String(whole).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  const dec=cents?','+String(cents).padStart(2,'0'):'';
  return w+dec+' €';
}
function fmtDate(s){
  if(!s) return '—';
  return new Date(s+'T00:00:00').toLocaleDateString('it-IT',{day:'2-digit',month:'short',year:'numeric'});
}

function renderInvalid(){
  app.innerHTML='<div class="card"><div class="alert alert-danger" style="margin-top:0">Questo link non è valido o non è più disponibile. Se pensi sia un errore, contatta direttamente chi te lo ha inviato.</div></div>';
}
function renderAlreadyResponded(d){
  const map={
    accettato:['Hai accettato questo preventivo.','alert-ok'],
    rifiutato:['Hai rifiutato questo preventivo.','alert-warn'],
    tempo:['Hai chiesto più tempo per decidere.','alert-info']
  };
  const m=map[d.clientResponse]||['Hai già risposto a questo preventivo.','alert-info'];
  const when=d.clientResponseAt?(' Risposta registrata il '+new Date(d.clientResponseAt).toLocaleDateString('it-IT')+'.'):'';
  app.innerHTML=
    '<div class="card">'+
      '<h1>'+esc(d.description||'Preventivo')+'</h1>'+
      '<div class="sub">Da '+esc(d.businessName||'')+'</div>'+
    '</div>'+
    '<div class="card"><div class="alert '+m[1]+'" style="margin-top:0">'+m[0]+when+'</div></div>';
}
function renderForm(d){
  app.innerHTML=
    '<div class="card">'+
      '<div class="sub">Ciao '+esc(d.clientName||'')+', preventivo da <b>'+esc(d.businessName||'')+'</b></div>'+
      '<h1>'+esc(d.description||'Preventivo')+'</h1>'+
      '<div class="amount">'+fmtMoney(d.amount)+'</div>'+
      '<div class="rows">'+
        (d.quoteNumber?'<div class="r"><span class="k">N. preventivo</span><span>'+esc(d.quoteNumber)+'</span></div>':'')+
        (d.sendDate?'<div class="r"><span class="k">Inviato il</span><span>'+fmtDate(d.sendDate)+'</span></div>':'')+
        (d.dueDate?'<div class="r"><span class="k">Valido fino al</span><span>'+fmtDate(d.dueDate)+'</span></div>':'')+
      '</div>'+
    '</div>'+
    '<div class="card">'+
      '<div class="question">Come vuoi rispondere?</div>'+
      '<button class="btn btn-primary" id="btn-accetta" type="button">Accetto il preventivo</button>'+
      '<button class="btn btn-outline" id="btn-tempo" type="button">Ho bisogno di più tempo</button>'+
      '<button class="btn btn-ghost" id="btn-rifiuta" type="button">Non mi interessa</button>'+
      '<label class="note-label" for="note">Vuoi aggiungere una nota? (opzionale)</label>'+
      '<textarea id="note" maxlength="300" placeholder="Es. ne parlo con il socio, richiamo lunedì…"></textarea>'+
    '</div>';
  document.getElementById('btn-accetta').onclick=()=>submitResponse('accettato');
  document.getElementById('btn-tempo').onclick=()=>submitResponse('tempo');
  document.getElementById('btn-rifiuta').onclick=()=>submitResponse('rifiutato');
}
function renderThankYou(type){
  const map={
    accettato:['Grazie, hai accettato il preventivo! Verrai ricontattato a breve.','alert-ok'],
    rifiutato:['Grazie per la risposta.','alert-warn'],
    tempo:['Va bene, ti ricontatteranno più avanti.','alert-info']
  };
  const m=map[type];
  app.innerHTML='<div class="card"><div class="alert '+m[1]+'" style="margin-top:0">'+m[0]+' Puoi chiudere questa pagina.</div></div>';
}

let sending=false;
async function submitResponse(type){
  if(sending) return;
  sending=true;
  document.querySelectorAll('#app button').forEach(b=>b.disabled=true);
  const noteEl=document.getElementById('note');
  const note=noteEl?noteEl.value.trim().slice(0,300):'';
  try{
    await db.collection('publicQuotes').doc(token).update({
      responded:true,
      clientResponse:type,
      clientResponseAt:new Date().toISOString(),
      clientNote:note||null
    });
    renderThankYou(type);
  }catch(e){
    console.error('Errore invio risposta',e);
    sending=false;
    document.querySelectorAll('#app button').forEach(b=>b.disabled=false);
    const lastCard=document.querySelector('#app .card:last-child');
    if(lastCard && !lastCard.querySelector('.alert-danger')){
      const d=document.createElement('div');
      d.className='alert alert-danger';
      d.textContent='Non sono riuscito a inviare la risposta. Controlla la connessione e riprova.';
      lastCard.appendChild(d);
    }
  }
}

async function init(){
  if(!token){ renderInvalid(); return; }
  try{
    const snap=await db.collection('publicQuotes').doc(token).get();
    if(!snap.exists){ renderInvalid(); return; }
    const d=snap.data();
    if(d.revoked){ renderInvalid(); return; }
    if(d.responded){ renderAlreadyResponded(d); return; }
    renderForm(d);
  }catch(e){
    console.error('Errore lettura preventivo pubblico',e);
    renderInvalid();
  }
}
init();
</script>
</body>
</html>
