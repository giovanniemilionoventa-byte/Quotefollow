<title>QuoteFollow — Non perdere un lavoro</title>
<style>
:root{
  color-scheme:light only;
  /* Sistema colore — "Agenda essenziale", v2: superfici vere, ombre diffuse tinte, raggi più generosi */
  --bg:#F2ECDD; --surface:#FFFFFF; --card:#FFFFFF; --border:rgba(28,24,21,.08);
  --text:#1C1815; --muted:#8A7F72; --muted-light:#B3A896;
  --primary:#7A3B47; --primary-dark:#5F2E38; --primary-soft:#F7E9EB; --primary-line:#EAD0D5; --on-primary:#FFFFFF;
  --success:#5B7A5D; --accent:#5B7A5D; --accent-soft:#EAF1EA;
  --warning:#B8935A; --warn:#B8935A; --warn-bg:#F7EEDF; --warn-line:#E8D3AC;
  --danger:#A84A38; --danger-soft:#F8E9E5; --danger-line:#E7C4B6;
  --gray-soft:#FBF7EE;
  --font-display:Georgia,'Noto Serif','Times New Roman',serif;
  --radius-lg:26px; --radius:22px; --radius-sm:16px; --radius-pill:999px;
  --shadow:0 12px 24px -14px rgba(28,24,21,.20), 0 2px 5px rgba(28,24,21,.04);
  --shadow-lg:0 22px 40px -14px rgba(122,59,71,.35), 0 4px 10px rgba(122,59,71,.12);
  --nav-h:78px;
}
/* Tipografia display — riservata a titoli grandi e numeri/importi (il serif è "audace", va usato con misura) */
.view-title,.app-header h1,.sheet-title,.detail-hero .d-client,
.today-num,.d-amount,.metric .m-value,.li-meta b{
  font-family:var(--font-display);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;color-scheme:light only}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg); color:var(--text); font-size:15px; line-height:1.45;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 28px);
}
input,select,textarea,button{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
h1,h2,h3{line-height:1.2}
.shell{max-width:760px;margin:0 auto;padding:0 14px}

/* ---------- Header ---------- */
.app-header{
  position:sticky;top:0;z-index:20;background:rgba(242,236,221,.82);
  backdrop-filter:blur(10px);
}
.app-header .shell{display:flex;align-items:center;justify-content:space-between;gap:10px;height:48px}
.brand-badge{
  flex:0 0 auto;width:28px;height:28px;border-radius:9px;background:var(--primary-soft);
  color:var(--primary);font-family:var(--font-display);font-weight:700;font-size:13px;
  display:flex;align-items:center;justify-content:center;
}
.app-header h1{font-size:18px;font-weight:800;letter-spacing:-.01em}
.app-header h1 .dot{color:var(--primary)}
.app-header .sub{font-size:12.5px;color:var(--muted);font-weight:600}
.header-actions{margin-left:auto;display:flex;gap:8px}
.app-header .back{font-size:15px;color:var(--primary);font-weight:600;padding:4px 4px 4px 0;border-radius:8px;display:inline-flex;align-items:center;gap:2px}
.app-header .back svg{width:19px;height:19px}
.app-header .back:hover{opacity:.75}
.view-title{font-size:32px;font-weight:700;margin:14px 2px 4px;letter-spacing:-.01em}
.view-sub{font-size:13.5px;color:var(--muted);margin:0 2px 16px;font-weight:500}

/* ---------- Bottom nav ---------- */
.bottom-nav{
  position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:30;
  max-width:760px;margin:0 auto;
  background:rgba(255,255,255,.86);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-radius:26px;
  box-shadow:0 16px 32px -12px rgba(28,24,21,.22);
}
.bottom-nav .inner{display:flex;height:var(--nav-h);padding:0 6px}
.nav-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:var(--muted-light);font-size:10.5px;font-weight:600;min-height:44px;transition:color .15s;
}
.nav-btn .pill-wrap{width:40px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:14px;transition:background-color .15s}
.nav-btn svg{width:21px;height:21px}
.nav-btn.active{color:var(--primary)}
.nav-btn.active .pill-wrap{background:var(--primary-soft)}
@media (hover:hover){
  .list-item:hover{box-shadow:var(--shadow-lg)}
  .chip:not(.active):hover{border-color:var(--muted-light);color:var(--text)}
  .nav-btn:not(.active):hover{color:var(--text)}
}

/* ---------- Views ---------- */
.view{display:none}
.view.active{display:block}

/* ---------- Cards & lists ---------- */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card + .card{margin-top:10px}
.card.pad{padding:14px}

.list-item{display:block;width:100%;text-align:left;padding:16px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:12px;transition:box-shadow .15s,transform .15s}
.list-item:active{background:var(--gray-soft)}
.li-top{display:flex;align-items:flex-start;gap:10px}
.li-main{flex:1;min-width:0}
.li-title{font-weight:700;font-size:15.5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;letter-spacing:-.005em}
.li-sub{color:var(--muted);font-size:13px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.li-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:9px;font-size:12px;color:var(--muted)}
.li-meta b{color:var(--text);font-size:15px}
.li-actions{display:flex;gap:8px;margin-top:13px}
.today-hero{padding:24px 22px;margin-bottom:14px;background:linear-gradient(155deg,var(--primary) 0%,var(--primary-dark) 100%);border:none;border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);position:relative;overflow:hidden}
.today-hero::after{content:'';position:absolute;right:-30px;top:-30px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.06);pointer-events:none}
.today-icon{width:40px;height:40px;border-radius:13px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;margin-bottom:14px;border:none;cursor:pointer;padding:0}
.today-icon.on{background:var(--on-primary)}
.today-icon.on svg{color:var(--primary)}
.today-icon svg{width:20px;height:20px;color:var(--on-primary)}
.today-kicker{font-size:12px;font-weight:600;letter-spacing:.01em;color:rgba(255,255,255,.68);margin-bottom:8px}
.today-row{display:flex;align-items:flex-end;gap:16px}
.today-num{font-size:58px;font-weight:700;line-height:.85;color:var(--on-primary)}
.today-copy{flex:1;min-width:0;padding-bottom:3px}
.today-title{font-size:16.5px;font-weight:700;line-height:1.3;color:var(--on-primary)}
.today-value{font-size:13px;font-weight:600;margin-top:4px;color:rgba(255,255,255,.72)}
.li-actions .btn-primary{font-weight:800}
.li-amount{font-weight:800;font-size:16px;white-space:nowrap}
.li-date{color:var(--muted);font-size:12px}

/* overdue highlight */
.list-item.overdue{box-shadow:0 12px 24px -14px rgba(168,74,56,.35), 0 2px 5px rgba(168,74,56,.10);background:var(--card)}
.list-item.overdue .li-title{color:var(--danger)}
.badge-overdue{font-size:11px;font-weight:800;color:var(--on-primary);background:var(--danger);border-radius:20px;padding:2px 8px}
.badge-oggi{font-size:11px;font-weight:800;color:var(--on-primary);background:var(--primary);border-radius:20px;padding:2px 8px}

/* ---------- Status badges ---------- */
.status-badge{font-size:11px;font-weight:700;border-radius:20px;padding:2px 9px;display:inline-flex;align-items:center;gap:4px}
.st-attesa{color:var(--warn);background:var(--warn-bg);border:1px solid var(--warn-line)}
.st-accettato{color:var(--accent);background:var(--accent-soft)}
.st-rifiutato{color:var(--danger);background:var(--danger-soft)}
.st-archiviato{color:var(--muted);background:var(--gray-soft)}
.st-soon{color:var(--warn);background:var(--warn-bg);border:1px solid var(--warn-line)}
.st-scaduto{color:var(--on-primary);background:var(--danger);border:1px solid var(--danger);font-weight:800}

/* ---------- Metrics ---------- */
.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.metric{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 13px;min-height:86px;display:flex;flex-direction:column;justify-content:space-between}
.metric .m-value{font-size:24px;font-weight:800;letter-spacing:-.02em}
.metric .m-label{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:3px}
.metric.hot{border-color:var(--danger)}
.metric.hot .m-value{color:var(--danger)}
.metric.blue .m-value{color:var(--primary)}
.metric.green .m-value{color:var(--accent)}

/* ---------- Chips / filters ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 13px;border-radius:20px;background:var(--card);border:1px solid var(--border);font-size:13px;font-weight:600;color:var(--muted);min-height:36px;transition:border-color .15s,color .15s,background-color .15s}
.chip.active{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}

/* ---------- Segmented control (sostituisce le chip nei filtri di stato) ---------- */
.segmented{display:flex;background:var(--gray-soft);border-radius:var(--radius-pill);padding:4px;gap:2px;margin-bottom:14px}
.seg{flex:1;text-align:center;padding:9px 4px;border-radius:var(--radius-pill);font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background-color .15s,color .15s,box-shadow .15s}
.seg.active{background:var(--surface);color:var(--text);box-shadow:0 3px 8px rgba(28,24,21,.10)}

/* ---------- Lista raggruppata (righe con hairline, un solo contenitore) ---------- */
.group{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:15px 16px;border-bottom:1px solid var(--border);transition:background-color .15s}
.group .row:last-child{border-bottom:none}
.row:active{background:var(--gray-soft)}
.row-main{flex:1;min-width:0}
.row-title{font-weight:700;font-size:15px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;letter-spacing:-.005em}
.row-title.overdue{color:var(--danger)}
.row-sub{color:var(--muted);font-size:12.5px;margin-top:2px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-meta{margin-top:6px;display:flex;gap:7px;flex-wrap:wrap}
.row-right{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.row-amount{font-weight:700;font-size:15px;font-family:var(--font-display);white-space:nowrap}
.chev{color:var(--muted-light);flex:0 0 auto}

/* ---------- Search ---------- */
.search{position:relative;margin-bottom:12px}
.search input{
  width:100%;padding:11px 14px 11px 40px;border:1px solid var(--border);border-radius:var(--radius-sm);
  background:var(--card);font-size:14px;outline:none;
}
.search input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted-light);pointer-events:none}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:var(--radius-pill);font-size:14px;font-weight:700;border:1px solid transparent;transition:filter .15s,transform .15s,background-color .15s,border-color .15s}
.btn:active{filter:brightness(.94);transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-outline{background:var(--card);border-color:var(--border);color:var(--text)}
.btn-soft{background:var(--primary-soft);color:var(--primary)}
.btn-danger{background:var(--danger);color:var(--on-primary)}
.btn-ghost{color:var(--danger);background:var(--danger-soft)}
.btn-gray{background:var(--gray-soft);color:var(--text)}
.btn-sm{min-height:34px;padding:0 13px;font-size:13px;border-radius:var(--radius-pill)}
.btn-block{width:100%}
.btn-success{background:var(--accent);color:var(--on-primary)}
.btn[disabled]{opacity:.5;pointer-events:none}
@media (hover:hover){
  .btn-primary:hover{background:var(--primary-dark)}
  .btn-outline:hover{border-color:var(--muted-light);background:var(--gray-soft)}
  .btn-soft:hover{background:var(--primary-line)}
  .btn-danger:hover{filter:brightness(.92)}
  .btn-ghost:hover{background:var(--danger-line)}
  .btn-gray:hover{filter:brightness(.96)}
  .btn-success:hover{filter:brightness(.92)}
}

/* ---------- Forms ---------- */
.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:5px}
.field input,.field textarea,.field select{
  width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);
  background:var(--card);font-size:14px;outline:none;
}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.field textarea{resize:vertical;min-height:74px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field-hint{font-size:11.5px;color:var(--muted-light);margin-top:4px}
.file-pick{
  display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border:1px dashed var(--border);
  border-radius:var(--radius-sm);background:var(--card);font-size:13px;color:var(--muted);
}
.file-pick .fname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}

/* ---------- Alerts ---------- */
.alert{border-radius:var(--radius-sm);padding:11px 13px;font-size:13px;margin-bottom:12px;display:flex;gap:9px;align-items:flex-start;line-height:1.4}
.alert b{display:block}
.alert-warn{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn)}
.alert-danger{background:var(--danger-soft);border:1px solid var(--danger-line);color:var(--danger)}
.alert-info{background:var(--primary-soft);border:1px solid var(--primary-line);color:var(--primary-dark)}

/* ---------- Detail ---------- */
.detail-hero{padding:20px;margin-bottom:14px}
.detail-hero .d-client{font-size:23px;font-weight:700;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.detail-hero .d-job{color:var(--muted);font-size:13.5px;margin-top:4px;font-weight:500}
.detail-hero .d-amount{font-size:34px;font-weight:700;margin-top:10px;letter-spacing:-.01em}
.d-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.d-item .k{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.d-item .v{font-size:14px;font-weight:700;margin-top:1px}
.section-title{font-size:19px;font-weight:700;font-family:var(--font-display);color:var(--text);margin:22px 2px 8px}
.action-stack{display:grid;gap:9px}
.action-stack .btn{min-height:46px}

/* kv-block: scadenza vs follow-up (UI distinte solo tramite il testo/nota colorata) */
.kv-block{border-radius:var(--radius-sm);padding:13px 14px;background:var(--card);box-shadow:var(--shadow)}
.kv-block .k{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted-light)}
.kv-block .v{font-size:15px;font-weight:700;margin-top:3px;line-height:1.25}
.kv-block .note{font-size:11.5px;font-weight:700;margin-top:3px}
.kv-block .note.danger{color:var(--danger)}
.kv-block .note.warn{color:var(--warn)}
.kv-block .note.ok{color:var(--accent)}

/* ---------- Timeline: righe raggruppate con pallino pieno colorato ---------- */
.tl-group{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:2px 17px;overflow:hidden}
.tl-row{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-bottom:1px solid var(--border)}
.tl-group .tl-row:last-child{border-bottom:none}
.tl-dot{width:9px;height:9px;border-radius:50%;background:var(--primary);margin-top:5px;flex:0 0 auto}
.tl-dot.contact{background:var(--accent)}
.tl-dot.status{background:var(--warn)}
.tl-dot.pdf{background:var(--text)}
.tl-dot.deferred{background:var(--muted-light)}
.tl-dot.sent{background:var(--primary)}
.tl-row .tl-label{font-size:13.5px;font-weight:700}
.tl-row .tl-note{font-size:12.5px;color:var(--muted);margin-top:1px}
.tl-row .tl-date{font-size:11.5px;color:var(--muted-light);margin-top:2px}

/* ---------- Sheets / modals ---------- */
.overlay{position:fixed;inset:0;background:rgba(43,38,32,.45);z-index:60;display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.sheet{
  background:var(--card);width:100%;max-width:760px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;
  padding:16px 16px calc(18px + env(safe-area-inset-bottom));animation:up .18s ease;
}
.sheet-center{border-radius:20px;margin:auto 0;animation:pop .18s ease;max-width:760px;max-height:92vh;overflow-y:auto;background:var(--card);width:100%;padding:16px 16px 18px}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:translateY(0);opacity:1}}
@keyframes pop{from{transform:scale(.96);opacity:.5}to{transform:scale(1);opacity:1}}
.sheet .grab{width:44px;height:4px;border-radius:2px;background:var(--border);margin:0 auto 12px}
.sheet-title{font-size:17px;font-weight:800;margin-bottom:4px}
.sheet-sub{font-size:13px;color:var(--muted);margin-bottom:14px}
.modal-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}
.modal-actions .btn{flex:1 1 calc(50% - 5px)}
.modal-actions .btn.solo{flex:1 1 100%}

/* followup summary */
.fu-summary{background:var(--gray-soft);border-radius:var(--radius-sm);padding:11px 13px;margin-bottom:14px;display:grid;grid-template-columns:1fr auto;gap:6px 14px}
.fu-summary .k{font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.fu-summary .v{font-size:14px;font-weight:700}
.fu-summary .right{text-align:right}

.defer-row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.defer-row .chip{font-size:12.5px}
.defer-row input[type=date]{flex:1 1 130px;min-width:0;padding:8px 9px;border:1px solid var(--border);border-radius:9px;font-size:13px;outline:none}
.defer-row input[type=date]:focus{border-color:var(--primary)}


/* ---------- Nuovi flussi Segui / Rimanda ---------- */
.contact-question{font-size:14px;font-weight:800;margin:4px 0 10px}
.contact-actions{display:grid;grid-template-columns:1fr;gap:9px;margin-bottom:14px}
.contact-btn{
  width:100%;min-height:58px;border:1px solid var(--border);border-radius:var(--radius-sm);
  background:var(--card);display:flex;align-items:center;justify-content:flex-start;gap:12px;
  padding:10px 14px;font-size:15px;font-weight:800;box-shadow:var(--shadow);text-align:left;
  transition:border-color .15s,box-shadow .15s;
}
.contact-btn:active{background:var(--gray-soft);transform:translateY(1px)}
.contact-btn .contact-icon{
  width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  flex:0 0 auto;background:var(--primary-soft);color:var(--primary);
}
.contact-btn .contact-icon svg{width:22px;height:22px}
.contact-btn .contact-copy{display:flex;flex-direction:column;gap:1px;min-width:0}
.contact-btn .contact-copy small{font-size:11px;color:var(--muted);font-weight:600}
@media (hover:hover){
  .contact-btn:hover{border-color:var(--primary-line);box-shadow:var(--shadow-lg)}
}
.secondary-section{border-top:1px solid var(--border);padding-top:13px;margin-top:4px}
.tpl-scroll{display:flex;gap:8px;overflow-x:auto;padding:1px 1px 6px;margin-bottom:10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tpl-scroll::-webkit-scrollbar{display:none}
.tpl-scroll .chip{flex:0 0 auto;white-space:nowrap;font-size:12.5px;padding:6px 12px}
.message-box{position:relative}
.message-box textarea{
  width:100%;min-height:100px;padding:12px 42px 13px 13px;border-radius:var(--radius-sm);
  border:1px solid var(--border);background:var(--gray-soft);color:var(--text);
  font:inherit;font-size:13.5px;line-height:1.5;resize:vertical;cursor:text;
}
.message-box textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);background:var(--card)}
.msg-icon-btn{
  position:absolute;width:29px;height:29px;border-radius:50%;background:var(--card);
  border:1px solid var(--border);display:flex;align-items:center;justify-content:center;
  color:var(--muted);transition:background-color .15s,color .15s,border-color .15s;
}
.msg-icon-btn svg{width:14px;height:14px}
.msg-icon-copy{top:8px;right:8px}
@media (hover:hover){
  .msg-icon-btn:hover{background:var(--primary-soft);color:var(--primary);border-color:var(--primary-line)}
}
.done-secondary{margin-top:14px;padding-top:13px;border-top:1px solid var(--border)}
.defer-question{font-size:14px;font-weight:800;margin:4px 0 12px}
.defer-options{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.defer-option{min-height:50px}
.defer-custom-box{display:none;margin-top:11px;padding:11px 12px;background:var(--gray-soft);border-radius:var(--radius-sm)}
.defer-custom-box.show{display:block}
.defer-custom-box .field{margin-bottom:9px}
.defer-custom-box .btn{width:100%}
@media (min-width:520px){
  .contact-actions{grid-template-columns:repeat(3,1fr)}
  .contact-btn{min-height:112px;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:12px 8px}
  .contact-btn .contact-copy small{display:none}
  .defer-options{grid-template-columns:repeat(3,1fr)}
}

/* ---------- PDF ---------- */
.pdf-frame{width:100%;height:62vh;border:none;border-radius:var(--radius-sm);background:var(--gray-soft)}
.doc-pill{display:inline-flex;align-items:center;gap:7px;background:var(--gray-soft);color:var(--text);border-radius:9px;padding:5px 11px;font-size:12.5px;font-weight:700}
.doc-pill svg{width:14px;height:14px}
.pdf-attach{display:flex;align-items:center;gap:11px;padding:12px 13px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm)}
.pdf-attach .p-icon{width:36px;height:36px;border-radius:9px;background:var(--gray-soft);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.pdf-attach .p-icon svg{width:18px;height:18px;color:var(--muted)}
.pdf-attach .p-name{flex:1;min-width:0;font-weight:700;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pdf-attach .p-size{font-size:11px;color:var(--muted-light)}
.pdf-actions{display:flex;gap:8px;margin-top:10px}
.pdf-actions .btn{flex:1}

/* ---------- Empty state ---------- */
.empty{text-align:center;padding:42px 20px;color:var(--muted)}
.empty svg{width:44px;height:44px;color:var(--muted-light);margin-bottom:10px}
.empty .e-title{font-weight:800;color:var(--text);font-size:15px}
.empty .e-sub{font-size:13px;margin-top:4px}

/* ---------- Toast ---------- */
#toast{
  position:fixed;left:50%;bottom:calc(var(--nav-h) + 30px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);
  background:rgba(43,38,32,.94);color:var(--on-primary);font-size:13.5px;font-weight:600;padding:10px 18px;border-radius:30px;
  z-index:99;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:88%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* settings */
.settings-group{margin-bottom:16px}
.settings-group h3{font-size:16px;font-weight:700;font-family:var(--font-display);color:var(--text);margin:0 2px 8px}
.danger-zone{border:1px solid var(--danger-line);border-radius:var(--radius);padding:13px;background:var(--card)}
@media (min-width:700px){
  .shell{padding-left:20px;padding-right:20px}
  .view-title{margin-top:22px}
  .metric-grid{grid-template-columns:repeat(4,1fr)}
  .today-hero{padding:18px 20px}
  .list-item{padding:16px}
  .detail-hero{padding:18px}
  .action-stack{max-width:680px}
  .sheet,.sheet-center{max-width:700px}
}
</style>

  <div style="width:64px;height:64px;border-radius:18px;background:var(--primary);color:var(--on-primary);font-family:var(--font-display);font-weight:700;font-size:28px;display:flex;align-items:center;justify-content:center;animation:boot-pulse 1.1s ease-in-out infinite">Q</div>
</div>

<!-- SCHERMATA LOGIN (mostrata solo se, dopo il controllo, l'utente NON risulta autenticato) -->
<div id="login-screen" style="position:fixed;inset:0;z-index:200;background:var(--bg);display:none;align-items:center;justify-content:center;padding:24px;overflow-y:auto">
  <div style="max-width:340px;width:100%;text-align:center">
    <div style="width:64px;height:64px;border-radius:18px;background:var(--primary);color:var(--on-primary);font-family:var(--font-display);font-weight:700;font-size:28px;display:flex;align-items:center;justify-content:center;margin:0 auto 18px">Q</div>
    <h1 style="font-family:var(--font-display);font-size:24px;font-weight:800;margin-bottom:6px">QuoteFollow<span style="color:var(--primary)">.</span></h1>
    <p style="color:var(--muted);font-size:14px;margin-bottom:24px">Accedi per gestire i tuoi preventivi e follow-up, sincronizzati su tutti i tuoi dispositivi.</p>

    <button id="login-btn" style="display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:48px;border-radius:var(--radius-sm);background:#FFFFFF;border:1px solid #DADCE0;color:#3C4043;font-size:14.5px;font-weight:600;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.08)">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.6 5.1 29.6 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.4-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.6 5.1 29.6 3 24 3 15.6 3 8.4 7.8 6.3 14.7z"/><path fill="#4CAF50" d="M24 45c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.6C29.5 36.1 26.9 37 24 37c-5.2 0-9.6-3.3-11.3-8l-6.6 5.1C8.4 40.2 15.6 45 24 45z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.3-4.1 5.7l6.6 5.6C41.5 36.4 45 30.8 45 24c0-1.4-.1-2.7-.4-3.5z"/></svg>
      Accedi con Google
    </button>

    <div style="display:flex;align-items:center;gap:10px;margin:20px 0">
      <div style="flex:1;height:1px;background:var(--border)"></div>
      <span style="color:var(--muted-light);font-size:12px">oppure</span>
      <div style="flex:1;height:1px;background:var(--border)"></div>
    </div>

    <div id="email-login-form">
      <button id="email-login-btn" class="btn btn-outline btn-block" style="min-height:48px;background:transparent;margin-bottom:10px">
        Accedi con email
      </button>
      <div class="field" style="text-align:left;margin-bottom:0">
        <input id="login-email" type="email" placeholder="La tua email" autocomplete="email"
          style="width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:transparent;font-size:14px;outline:none;color:var(--text)">
      </div>
      <p style="color:var(--muted-light);font-size:11.5px;margin-top:10px;line-height:1.4">Ti mandiamo un link di accesso via email, senza password.</p>
    </div>

    <p id="login-error" style="color:var(--danger);font-size:12.5px;margin-top:16px;display:none"></p>
    <p id="login-info" style="color:var(--accent);font-size:12.5px;margin-top:16px;display:none"></p>
    <p style="color:var(--muted-light);font-size:11.5px;margin-top:24px">I tuoi dati sono privati e visibili solo al tuo account.</p>
  </div>
</div>

<div class="app-header">

      <span>Opportunità</span>

      <span>Documenti</span>

<script>
'use strict';
/* ============================================================
   QuoteFollow — single-file app. Dati su Cloud Firestore (per utente autenticato)
   + PDF in IndexedDB locale.
   "Opportunità" = affare commerciale; "Preventivo" = SOLO documento PDF.
   ============================================================ */

/* ---------- IDB: blob PDF ---------- */
const DB_NAME='quotefollow', DB_VER=1;
let _db=null;
function openDB(){
  return new Promise((res,rej)=>{
    if(_db) return res(_db);
    const rq=indexedDB.open(DB_NAME,DB_VER);
    rq.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains('pdfs')) d.createObjectStore('pdfs',{keyPath:'id'});
    };
    rq.onsuccess=()=>{_db=rq.result;res(_db)};
    rq.onerror=()=>rej(rq.error);
  });
}
function tx(mode,fn){
  return openDB().then(db=>new Promise((res,rej)=>{
    const t=db.transaction('pdfs',mode), st=t.objectStore('pdfs');
    const r=fn(st);
    t.oncomplete=()=>res(r && r.result);
    t.onerror=()=>rej(t.error);
  }));
}
const idbPut=(id,blob,meta)=>tx('readwrite',st=>st.put({id,blob,meta}));
const idbGet=id=>tx('readonly',st=>st.get(id)).then(r=>r?r.blob:null);
const idbDel=id=>tx('readwrite',st=>st.delete(id));
const idbAll=()=>tx('readonly',st=>st.getAll());
const idbClear=()=>tx('readwrite',st=>st.clear());

/* ---------- Date utils ---------- */
const pad=n=>String(n).padStart(2,'0');
function todayStr(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function addDays(s,n){const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function daysBetween(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5)}
function fmtDate(s){if(!s)return '—';return new Date(s+'T00:00:00').toLocaleDateString('it-IT',{day:'2-digit',month:'short',year:'numeric'})}
function fmtRel(s){
  if(!s)return '';
  const d=daysBetween(todayStr(),s);
  if(d===0)return 'Oggi'; if(d===1)return 'Domani';
  if(d>1)return 'Tra '+d+' gg';
  if(d===-1)return 'Ieri'; if(d===-2)return '2 gg fa'; if(d===-3)return '3 gg fa';
  if(d<-3)return (-d)+' gg fa'; return '';
}
function relDue(s){
  if(!s)return null;
  const d=daysBetween(todayStr(),s);
  if(d<0)return {label:'Scaduta da '+(-d)+' gg',overdue:true};
  if(d===0)return {label:'Scade oggi',overdue:true};
  if(d===1)return {label:'Scade domani',soon:true};
  if(d<=3)return {label:'Scade tra '+d+' gg',soon:true};
  return null;
}
function nowHHMM(){const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())}
function isoNow(){return new Date().toISOString()}
function fmtDateTime(ts){
  if(!ts) return '';
  const d=new Date(ts);
  if(isNaN(d.getTime())) return String(ts);
  const day=String(d.getDate()).padStart(2,'0')+' '+d.toLocaleDateString('it-IT',{month:'short'});
  return day+' · '+pad(d.getHours())+':'+pad(d.getMinutes());
}
const fmtMoney=n=>{
  const v=Number(n)||0; const neg=v<0; const a=Math.abs(v);
  const whole=Math.floor(a);
  const cents=Math.round((a-whole)*100);
  const w=String(whole).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  const dec=cents?','+String(cents).padStart(2,'0'):'';
  return (neg?'-':'')+w+dec+' €';
};
const uid=()=> (crypto.randomUUID?crypto.randomUUID():'id'+Date.now()+Math.random().toString(36).slice(2,8));

/* ---------- Stato ---------- */
let settings, quotes, pdfs, clients;
let currentView='oggi', selectedQuoteId=null, quoteFilter='tutte', quoteSearch='', docSearch='';

function defaultSettings(){
  return {
    businessName:'La mia attività',
    lastExportAt:null,
    notifsEnabled:false, lastNotifyKey:null,
    fu1Default:3, fu2Default:7,
    installBannerDismissed:false,
    tplProf:'Ciao {cliente}, volevo sapere se hai avuto modo di dare un\'occhiata al preventivo. Fammi sapere se c\'è qualcosa di cui vuoi discutere, resto a disposizione.',
    tplInfo:'Ciao {cliente}! Hai avuto modo di vedere il preventivo? Fammi sapere, così posso procedere con calma.',
    tplDir:'Ciao {cliente}, ti scrivo per sapere se hai valutato il preventivo che ti ho inviato. Avresti bisogno di chiarimenti?',
    tplLast:'Ciao {cliente}, ti ricontatto un\'ultima volta riguardo al preventivo. Se non è più di tuo interesse, dimmelo così posso archiviarlo.'
  };
}

/* ---------- Persistenza (Cloud Firestore) ----------
   Un documento per utente in collezione 'userData', keyed by uid.
   I PDF restano in IndexedDB locale (i blob non ci stanno bene in Firestore
   e non serve sincronizzarli fra dispositivi per la v1 di questa funzione). */
let _saveTimer=null;
function saveData(){
  if(!currentUser) return;
  clearTimeout(_saveTimer);
  _saveTimer=setTimeout(()=>{
    db.collection('userData').doc(currentUser.uid).set({
      settings,quotes,clients,updatedAt:new Date().toISOString()
    }).catch(e=>{console.error('Errore salvataggio cloud',e);toast('Errore salvataggio: '+e.message);});
  },400); // debounce: raggruppa scritture ravvicinate in una sola
}
async function loadData(){
  const snap=await db.collection('userData').doc(currentUser.uid).get();
  if(snap.exists){
    const d=snap.data();
    settings=Object.assign(defaultSettings(),d.settings||{});
    quotes=d.quotes||[]; clients=d.clients||[];
    migrateQuotes();
  }else{
    // Primo accesso per questo utente: parte pulito, non demo.
    settings=defaultSettings(); quotes=[]; clients=[];
  }
  pdfs=[]; // i metadati PDF locali si ricostruiscono da IndexedDB al bisogno
  await loadPdfMetaFromIdb();
}
/* I metadati dei PDF (nome/size/collegamento a opportunità) li teniamo in
   IndexedDB insieme al blob, così restano coerenti anche offline. */
async function loadPdfMetaFromIdb(){
  try{
    const all=await idbAll();
    pdfs=all.filter(r=>r.meta).map(r=>r.meta);
  }catch(e){ pdfs=[]; }
}

/* ---------- Migrazione dati (retrocompatibilità) ----------
   Vecchio modello: quotes[].followups + niente lastContact/timeline.
   Nuovo modello: quotes[].timeline + quotes[].lastContact.        */
function migrateQuotes(){
  quotes.forEach(q=>{
    if(!q) return;
    if(!Array.isArray(q.timeline)){
      q.timeline=[];
      const created=q.createdAt||q.sendDate||todayStr();
      q.timeline.push({id:uid(),ts:created+'T09:00',type:'created',label:'Opportunità creata'});
      if(q.sendDate) q.timeline.push({id:uid(),ts:q.sendDate+'T09:00',type:'sent',label:'Preventivo inviato'});
      if(Array.isArray(q.followups)){
        q.followups.forEach(f=>{
          if(f.type==='done'){
            q.timeline.push({id:f.id||uid(),ts:(f.date||created)+'T09:00',type:'contact',contactType:'fatto',label:'Segnato come fatto',note:f.note||''});
          }else{
            q.timeline.push({id:f.id||uid(),ts:(f.date||created)+'T09:00',type:'deferred',label:f.what||'Follow-up rimandato',note:f.note||''});
          }
        });
      }
      delete q.followups;
    }
    if(q.lastContact && q.lastContact.type==='inviato') q.lastContact=null;
    if(!q.lastContact) q.lastContact=null;
    if(!['attesa','accettato','rifiutato','archiviato'].includes(q.status)) q.status='attesa';
    if(typeof q.waitForClient!=='boolean') q.waitForClient=false;
  });
}

/* ---------- Demo PDF (PDF minimale valido) ---------- */
function buildPdf(lines){
  const obj=[];
  obj[1]='<< /Type /Catalog /Pages 2 0 R >>';
  obj[2]='<< /Type /Pages /Kids [3 0 R] /Count 1 >>';
  obj[3]='<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >>';
  obj[4]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>';
  let content='BT /F1 18 Tf 70 770 Td (PREVENTIVO) Tj ET\n';
  lines.forEach((l,i)=>{ content+='BT /F1 12 Tf 70 '+(735-i*26)+' Td ('+l+') Tj ET\n'; });
  content+='BT /F1 10 Tf 70 60 Td (Generato con QuoteFollow) Tj ET\n';
  obj[5]='<< /Length '+content.length+' >>\nstream\n'+content+'endstream';
  let out='%PDF-1.4\n', offsets=[];
  for(let n=1;n<=5;n++){ offsets[n]=out.length; out+=n+' 0 obj\n'+obj[n]+'\nendobj\n'; }
  const xrefStart=out.length;
  out+='xref\n0 6\n0000000000 65535 f \n';
  for(let n=1;n<=5;n++) out+=(offsets[n]+'').padStart(10,'0')+' 00000 n \n';
  out+='trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n'+xrefStart+'\n%%EOF';
  return out;
}

/* ---------- Util clienti ---------- */
function getClient(id){return clients.find(c=>c.id===id)||{name:'?',email:'',phone:''}}
function ensureClient(name,email,phone){
  const n=(name||'').trim();
  if(!n) return null;
  let c=clients.find(x=>x.name.toLowerCase()===n.toLowerCase());
  if(!c){c={id:uid(),name:n,email:(email||'').trim(),phone:(phone||'').trim(),createdAt:todayStr()};clients.push(c);}
  else{
    if(email&&email.trim()) c.email=email.trim();
    if(phone&&phone.trim()) c.phone=phone.trim();
  }
  return c;
}
function clientQuotes(cid){return quotes.filter(q=>q.clientId===cid)}
function clientPdfs(cid){const qs=clientQuotes(cid);return pdfs.filter(p=>qs.some(q=>q.pdfId===p.id))}
function quotePdf(q){return q&&q.pdfId?pdfs.find(p=>p.id===q.pdfId):null}
function pdfOwner(pdf){const q=quotes.find(x=>x.pdfId===pdf.id);return q?getClient(q.clientId).name:'—'}

/* ---------- Stato opportunità ---------- */
const STATUS={
  attesa:{label:'In attesa',cls:'st-attesa'},
  accettato:{label:'Accettata',cls:'st-accettato'},
  rifiutato:{label:'Rifiutata',cls:'st-rifiutato'},
  archiviato:{label:'Archiviata',cls:'st-archiviato'},
};
const CONTACT_TYPES={
  whatsapp:'WhatsApp',
  email:'Email',
  telefono:'Telefono',
  fatto:'Contatto registrato',
  manuale:'Contatto manuale'
};
const TIMELINE_CONTACT_TYPES={
  whatsapp:'Contatto WhatsApp',
  email:'Contatto Email',
  telefono:'Contatto telefonico',
  fatto:'Follow-up completato',
  manuale:'Contatto manuale'
};
function isExpired(q){return q.status==='attesa'&&q.dueDate&&q.dueDate<todayStr()}
function qStatusKey(q){return q&&STATUS[q.status]?q.status:'attesa'}
function qStatusBadge(q){
  const s=STATUS[qStatusKey(q)]||STATUS.attesa;
  return '<span class="status-badge '+s.cls+'">'+s.label+'</span>';
}
function isActive(q){return q.status==='attesa'}
function isOverdue(q){return isActive(q)&&!q.waitForClient&&q.currentFuDate&&q.currentFuDate<todayStr()}

/* ---------- Ultimo contatto ---------- */
function lastContactLabel(q){
  const lc=q.lastContact;
  if(!lc || lc.type==='inviato') return 'Mai contattato';
  const type=CONTACT_TYPES[lc.type]||lc.type;
  let s=(fmtRel(lc.date)||fmtDate(lc.date)).toLowerCase()+' · '+type;
  if(lc.time) s+=' · '+lc.time;
  return s;
}
function recordContact(q,type,note){
  q.lastContact={date:todayStr(),time:nowHHMM(),type,note:note||''};
  q.timeline=q.timeline||[];
  q.timeline.push({id:uid(),ts:isoNow(),type:'contact',contactType:type,label:TIMELINE_CONTACT_TYPES[type]||CONTACT_TYPES[type]||type,note:note||''});
  saveData();
}

/* ---------- Timeline ---------- */
function renderTimeline(q){

/* ---------- Nav ---------- */
function goto(view){

/* ============================================================
   RENDERING
   ============================================================ */
function renderAll(){
  if(currentView==='oggi') renderOggi();
  else if(currentView==='opportunita') renderOpportunita();
  else if(currentView==='documenti') renderDocumenti();
  else if(currentView==='impostazioni') renderImpostazioni();
  else if(currentView==='dettaglio') renderDettaglio();
}

/* ---------- Promemoria backup ---------- */
function daysSinceExport(){
  if(!settings.lastExportAt) return null;
  const d=Math.floor((Date.now()-new Date(settings.lastExportAt).getTime())/864e5);
  return d<0?0:d;
}
const BACKUP_REMINDER_DAYS=14;
/* ---------- Notifiche locali (senza backend) ---------- */
function notifsSupported(){return 'Notification' in window}
function toggleNotifs(){
  if(!notifsSupported()){toast('Il browser non supporta le notifiche');return;}
  if(Notification.permission==='granted'){
    settings.notifsEnabled=!settings.notifsEnabled;
    saveData();
    toast(settings.notifsEnabled?'Notifiche attive':'Notifiche disattivate');
    if(currentView==='oggi') renderOggi();
    if(currentView==='impostazioni') renderImpostazioni();
  }else if(Notification.permission==='denied'){
    toast('Notifiche bloccate: abilitale dalle impostazioni del browser');
  }else{
    Notification.requestPermission().then(p=>{
      settings.notifsEnabled=(p==='granted');
      saveData();
      toast(p==='granted'?'Notifiche attive':'Permesso non concesso');
      if(currentView==='oggi') renderOggi();
      if(currentView==='impostazioni') renderImpostazioni();
      if(p==='granted') maybeNotifyToday(true);
    });
  }
}
function showLocalNotification(title,body,tag){
  // Preferisce il service worker (più affidabile, specie su Android Chrome);
  // se non è ancora pronto usa il costruttore Notification come fallback.
  if('serviceWorker' in navigator && navigator.serviceWorker.controller){
    navigator.serviceWorker.ready.then(reg=>{
      if(reg && reg.active){
        reg.active.postMessage({type:'SHOW_NOTIFICATION',title,body,tag});
      }else{
        try{ new Notification(title,{body,tag}); }catch(e){console.warn('Notifica non mostrata',e);}
      }
    }).catch(()=>{
      try{ new Notification(title,{body,tag}); }catch(e){console.warn('Notifica non mostrata',e);}
    });
  }else{
    try{ new Notification(title,{body,tag}); }catch(e){console.warn('Notifica non mostrata',e);}
  }
}
function maybeNotifyToday(force){
  if(!notifsSupported()||Notification.permission!=='granted'||!settings.notifsEnabled) return;
  const list=quotes.filter(isActive).filter(q=>!q.waitForClient&&q.currentFuDate&&q.currentFuDate<=todayStr());
  const key=todayStr()+':'+list.length;
  if(!force && settings.lastNotifyKey===key) return;
  settings.lastNotifyKey=key; saveData();
  if(list.length===0) return;
  showLocalNotification(
    'QuoteFollow — Attenzione oggi',
    list.length+' follow-up da chiudere oggi. Apri l\'app per vedere chi contattare.',
    'quotefollow-oggi'
  );
}

function backupBanner(){
  const d=daysSinceExport();
  if(d===null){
    return '<div class="alert alert-warn"><div><b>Nessun backup effettuato</b>'+
      'I dati sono salvati solo su questo dispositivo/browser: cambiando telefono o svuotando la cache li perderesti. '+
      '<button class="btn btn-sm btn-primary" style="margin-top:8px" data-action="export">Esporta backup ora</button></div></div>';
  }
  if(d>=BACKUP_REMINDER_DAYS){
    return '<div class="alert alert-warn"><div><b>Backup non aggiornato</b>'+
      'Ultimo backup '+d+' giorni fa. '+
      '<button class="btn btn-sm btn-primary" style="margin-top:8px" data-action="export">Esporta backup ora</button></div></div>';
  }
  return '';
}

/* ---------- OGGI ---------- */
function renderOggi(){
  const act=quotes.filter(isActive);

const FILTERS=[
  ['tutte','Tutte'],['attesa','In attesa'],['accettato','Accettate'],['rifiutato','Rifiutate'],['archiviato','Archiviate']
];
function filteredQuotes(){
  let list=quotes.slice();
  if(quoteFilter==='attesa') list=list.filter(q=>q.status==='attesa');
  else if(quoteFilter==='accettato') list=list.filter(q=>q.status==='accettato');
  else if(quoteFilter==='rifiutato') list=list.filter(q=>q.status==='rifiutato');
  else if(quoteFilter==='archiviato') list=list.filter(q=>q.status==='archiviato');
  const s=quoteSearch.trim().toLowerCase();
  if(s) list=list.filter(q=>{
    const c=getClient(q.clientId).name;
    return (c+' '+q.description+' '+q.quoteNumber).toLowerCase().includes(s);
  });
  return list.sort((a,b)=>(b.sendDate||'').localeCompare(a.sendDate||''));
}

/* ---------- Link pubblico di accettazione ---------- */
/* Collezione Firestore separata "publicQuotes/{token}": contiene SOLO i campi
   non sensibili di UN preventivo, mai l'intero account. È l'unico documento
   leggibile/scrivibile senza login (vedi regole di sicurezza consigliate). */
function publicLinkUrl(token){
  return new URL('accetta.html?t='+token, window.location.href).toString();
}
async function ensurePublicLink(q){
  if(q.publicLink && q.publicLink.status==='active') return q.publicLink;
  const token=uid();
  const c=getClient(q.clientId);
  const payload={
    ownerUid:currentUser.uid, quoteId:q.id,
    businessName:settings.businessName||'',
    clientName:c.name||'', description:q.description||'',
    amount:Number(q.amount)||0, quoteNumber:q.quoteNumber||'',
    sendDate:q.sendDate||'', dueDate:q.dueDate||'',
    responded:false, clientResponse:null, clientResponseAt:null, clientNote:null,
    revoked:false, createdAt:isoNow()
  };
  await db.collection('publicQuotes').doc(token).set(payload);
  q.publicLink={token,createdAt:isoNow(),status:'active',lastProcessedResponseAt:null};
  q.timeline=q.timeline||[];
  q.timeline.push({id:uid(),ts:isoNow(),type:'status',label:'Link di accettazione creato'});
  saveData();
  return q.publicLink;
}

/* Ascolto in tempo reale delle risposte arrivate dal link pubblico */
let _publicUnsub=null;
function listenPublicResponses(){
  if(_publicUnsub){ _publicUnsub(); _publicUnsub=null; }
  if(!currentUser) return;
  _publicUnsub=db.collection('publicQuotes').where('ownerUid','==',currentUser.uid)
    .onSnapshot(snap=>{
      snap.docChanges().forEach(ch=>{
        if(ch.type==='added'||ch.type==='modified') processPublicResponse(ch.doc.id,ch.doc.data());
      });
    },err=>console.warn('Ascolto link pubblici non disponibile',err));
}
function processPublicResponse(token,data){
  if(!data||!data.responded) return;
  const q=quotes.find(x=>x.id===data.quoteId);
  if(!q||!q.publicLink||q.publicLink.token!==token) return;
  if(q.publicLink.lastProcessedResponseAt===data.clientResponseAt) return; // già gestita
  q.publicLink.lastProcessedResponseAt=data.clientResponseAt;
  const c=getClient(q.clientId);
  const noteTxt=data.clientNote?(' — nota del cliente: "'+data.clientNote+'"'):'';
  q.timeline=q.timeline||[];
  if(data.clientResponse==='accettato'){
    q.timeline.push({id:uid(),ts:isoNow(),type:'status',label:'Il cliente ha accettato il preventivo tramite link'+noteTxt});
    q.status='accettato'; q.currentFuDate=null;
    toast('🎉 '+c.name+' ha accettato il preventivo!');
  }else if(data.clientResponse==='rifiutato'){
    q.timeline.push({id:uid(),ts:isoNow(),type:'status',label:'Il cliente ha rifiutato il preventivo tramite link'+noteTxt});
    q.status='rifiutato'; q.currentFuDate=null;
    toast(c.name+' ha rifiutato il preventivo');
  }else{
    q.timeline.push({id:uid(),ts:isoNow(),type:'contact',contactType:'manuale',label:'Il cliente ha chiesto più tempo tramite link'+noteTxt});
    toast(c.name+' ha chiesto più tempo per decidere');
  }
  saveData();
  if(currentView==='dettaglio'&&selectedQuoteId===q.id) renderDettaglio();
  else if(currentView==='oggi') renderOggi();
  else if(currentView==='opportunita') renderOppList();
}

/* ---------- PDF.js (rendering universale, anche su mobile) ---------- */
let _pdfJsLoading=null;
function loadPdfJs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if(_pdfJsLoading) return _pdfJsLoading;
  _pdfJsLoading=new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload=()=>{
      window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      resolve(window.pdfjsLib);
    };
    s.onerror=()=>reject(new Error('pdf.js non caricato'));
    document.head.appendChild(s);
  });
  return _pdfJsLoading;
}
async function renderPdfIntoContainer(blob,container){
  container.innerHTML='<div style="text-align:center;color:var(--muted);padding:24px 0">Caricamento anteprima…</div>';
  try{
    const pdfjsLib=await loadPdfJs();
    const buf=await blob.arrayBuffer();
    const doc=await pdfjsLib.getDocument({
      data:buf,
      standardFontDataUrl:'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/standard_fonts/'
    }).promise;
    container.innerHTML='';
    container.style.background='var(--gray-soft)';
    container.style.overflowY='auto';
    container.style.display='block';
    const maxPages=Math.min(doc.numPages,20);
    const dpr=Math.min(window.devicePixelRatio||1,3); // limite 3x per non esagerare con memoria/tempo
    for(let n=1;n<=maxPages;n++){
      const page=await doc.getPage(n);
      const containerWidth=container.clientWidth-16;
      const baseViewport=page.getViewport({scale:1});
      const cssScale=containerWidth/baseViewport.width;
      const renderViewport=page.getViewport({scale:cssScale*dpr});
      const canvas=document.createElement('canvas');
      canvas.style.cssText='display:block;width:'+containerWidth+'px;height:'+(renderViewport.height/dpr)+'px;margin:8px auto;box-shadow:var(--shadow);border-radius:8px;background:#fff';
      canvas.width=renderViewport.width;
      canvas.height=renderViewport.height;
      const ctx=canvas.getContext('2d');
      await page.render({canvasContext:ctx,viewport:renderViewport}).promise;
      container.appendChild(canvas);
    }
    if(doc.numPages>maxPages){
      const note=document.createElement('div');
      note.style.cssText='text-align:center;color:var(--muted);font-size:12px;padding:8px 0';
      note.textContent='Anteprima limitata alle prime '+maxPages+' pagine. Scarica il PDF per vederlo tutto.';
      container.appendChild(note);
    }
  }catch(e){
    console.warn('Anteprima PDF non disponibile',e);
    container.style.display='flex';
    container.style.alignItems='center';
    container.style.justifyContent='center';
    container.innerHTML='<div style="text-align:center;color:var(--danger);padding:20px">'+
      'Anteprima non disponibile<br><span style="font-size:12px;color:var(--muted)">Usa il pulsante "Scarica PDF" per aprirlo</span>'+
    '</div>';
  }
}

/* ---------- Export / Import ---------- */
function exportData(){
  toast('Preparazione export…');
  idbAll().then(async all=>{
    const pdfsExport=[];
    for(const p of pdfs){
      const rec=all.find(r=>r.id===p.id);
      let data=null;
      if(rec&&rec.blob){data=await blobToBase64(rec.blob);}
      pdfsExport.push({id:p.id,name:p.name,size:p.size,type:p.type,quoteId:p.quoteId,storedAt:p.storedAt,data});
    }
    const json=JSON.stringify({app:'QuoteFollow',version:1,exportedAt:new Date().toISOString(),settings,clients,quotes,pdfs:pdfsExport});
    const blob=new Blob([json],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='quotefollow-export-'+todayStr()+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    settings.lastExportAt=new Date().toISOString();
    saveData();
    if(currentView==='oggi') renderOggi();
    else if(currentView==='impostazioni') renderImpostazioni();
    toast('Export scaricato');
  }).catch(e=>{console.error(e);toast('Errore export');});
}
function blobToBase64(blob){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>{const s=r.result;const b64=s.split(',')[1];res(b64)};
    r.onerror=rej; r.readAsDataURL(blob);
  });
}
function base64ToBlob(b64,type){
  const bin=atob(b64); const arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new Blob([arr],{type:type||'application/pdf'});
}
async function importData(file){
  if(!file)return;
  try{
    const txt=await file.text();
    const d=JSON.parse(txt);
    if(!d.quotes||!Array.isArray(d.quotes)){toast('File JSON non valido');return;}
    if(!confirm('Importando sostituirai tutti i dati correnti. Continuare?'))return;
    settings=Object.assign(defaultSettings(),d.settings||{});
    clients=d.clients||[]; quotes=d.quotes||[]; pdfs=[];
    migrateQuotes();
    await openDB();
    const prev=await idbAll();
    for(const r of prev) await idbDel(r.id);
    if(d.pdfs&&d.pdfs.length){
      for(const p of d.pdfs){
        const meta={id:p.id,name:p.name,size:p.size,type:p.type,quoteId:p.quoteId,storedAt:p.storedAt||todayStr()};
        pdfs.push(meta);
        if(p.data){const b=base64ToBlob(p.data,p.type||'application/pdf');await idbPut(p.id,b,meta);}
      }
    }
    saveData();
    goto('opportunita');
    toast('Dati importati');
  }catch(e){console.error(e);toast('Errore import: file non valido');}
}
function wipeData(){
  if(!confirm('Cancellare TUTTI i dati (opportunità, clienti, PDF e impostazioni)? L\'operazione è irreversibile.'))return;
  openDB().then(async()=>{
    await idbClear();
    settings=defaultSettings();
    quotes=[]; pdfs=[]; clients=[];
    selectedQuoteId=null; quoteFilter='tutte'; quoteSearch=''; docSearch='';
    saveData();
    goto('oggi');
    toast('Tutti i dati sono stati cancellati');
  }).catch(e=>{
    console.error(e);
    settings=defaultSettings();
    quotes=[]; pdfs=[]; clients=[];
    selectedQuoteId=null; quoteFilter='tutte'; quoteSearch=''; docSearch='';
    saveData();
    goto('oggi');
    toast('Dati cancellati (PDF non raggiungibili, riavvia l\'app)');
  });
}

function emptyState(t,s){return '<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="13" y2="17"/></svg><div class="e-title">'+t+'</div><div class="e-sub">'+s+'</div></div>'}

    const map={prof:'tplProf',info:'tplInfo',dir:'tplDir',last:'tplLast'};
    const ta=document.getElementById('fu-msg');
    if(ta) ta.value=renderTpl(settings[map[el.dataset.tpl]]||'',c.name);
    document.querySelectorAll('.tpl-scroll .chip').forEach(b=>b.classList.toggle('active',b===el));
  }
  else if(act==='show-custom-defer'){
    const box=document.getElementById('defer-custom-box');
    if(box) box.classList.toggle('show');
  }
  else if(act==='copy-text'){
    const txt=fuMsg();
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(()=>toast('Testo copiato')).catch(()=>copyFallback(txt));
    }else copyFallback(txt);
  }
  else if(act==='fu-done'){doFollowDone();}
  else if(act==='defer'){doDefer(parseInt(el.dataset.days,10));}
  else if(act==='defer-custom'){doDeferCustom();}
  else if(act==='wa'){doWhatsApp();}
  else if(act==='mail'){doEmail();}
  else if(act==='phone'){doPhone();}
  else if(act==='contact-yes'){contactYes(id);}
  else if(act==='contact-no'){contactNo();}
  else if(act==='open-client'){openClientSheet(id);}
  else if(act==='edit-last-contact'){openLastContactEdit(id);}
  else if(act==='save-last-contact'){saveLastContact(id);}
  else if(act==='clear-last-contact'){clearLastContact(id);}
  else if(act==='open-pdf'){openPdfViewer(id);}
  else if(act==='download-pdf'){downloadPdf(id);}
  else if(act==='replace-pdf'){
    const fi=document.createElement('input');fi.type='file';fi.accept='.pdf,application/pdf';
    fi.onchange=async()=>{
      const f=fi.files[0];if(!f)return;
      const p=pdfs.find(x=>x.id===id);if(!p)return;
      p.name=f.name;p.size=f.size;p.type=f.type;
      await idbPut(id,f,p);
      const q=quotes.find(x=>x.pdfId===id);
      if(q){q.timeline=q.timeline||[];q.timeline.push({id:uid(),ts:isoNow(),type:'pdf',label:'PDF sostituito: '+f.name});}
      saveData();renderAll();toast('PDF sostituito');
    };
    fi.click();
  }
  else if(act==='delete-pdf'){
    if(confirm('Eliminare il PDF "'+(pdfs.find(p=>p.id===id)||{}).name+'"?')){
      removePdfFromQuote(id);
      renderAll();toast('PDF eliminato');
    }
  }
  else if(act==='remove-pdf-in-form'){
    const q=currentFormQuote();
    const qId=q&&q.id;
    if(q&&q.pdfId) removePdfFromQuote(q.pdfId);
    closeModal();
    if(qId) openQuoteForm(qId);
  }
  else if(act==='set-status'){setQuoteStatus(id,el.dataset.status);}
  else if(act==='reopen'){reopenQuote(id);}
  else if(act==='toggle-wait-client'){toggleWaitForClient(id);}
  else if(act==='save-settings'){
    settings.businessName=document.getElementById('set-name').value.trim()||'La mia attività';
    settings.fu1Default=Math.max(0,parseInt(document.getElementById('set-fu1').value,10)||0);
    settings.fu2Default=Math.max(0,parseInt(document.getElementById('set-fu2').value,10)||0);
    settings.tplProf=document.getElementById('tpl-prof').value;
    settings.tplInfo=document.getElementById('tpl-info').value;
    settings.tplDir=document.getElementById('tpl-dir').value;
    settings.tplLast=document.getElementById('tpl-last').value;
    saveData();renderAll();
    toast('Impostazioni salvate');
  }
  else if(act==='export'){exportData();}
  else if(act==='import'){document.getElementById('import-file').click();}
  else if(act==='wipe'){wipeData();}
});

document.addEventListener('keydown',e=>{ if(e.key==='Escape'){closeModal();} });

function currentFormQuote(){return quotes.find(x=>x.id===document.getElementById('qf-id').value)}
function copyFallback(txt){
  const ta=document.createElement('textarea');ta.value=txt;
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');toast('Testo copiato');}catch(e){toast('Copia non riuscita');}
  ta.remove();
}

/* ---------- PWA: installazione ---------- */
let deferredInstallPrompt=null;
function isStandalone(){
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true;
}
function isIOS(){
  return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
}
/* Banner in Home: appare subito dopo il login, solo se l'app NON è già
   installata e l'utente non lo ha già chiuso. Sparisce da sola non appena
   isStandalone() diventa vero (cioè non appena viene installata). */
function shouldShowInstallBanner(){
  if(isStandalone()) return false;
  if(settings.installBannerDismissed) return false;
  return !!(deferredInstallPrompt || isIOS());
}
function installBannerHTML(){
  if(!shouldShowInstallBanner()) return '';
  const body = deferredInstallPrompt
    ? ('<div style="flex:1;min-width:0">'+
        '<div style="font-weight:800;font-size:13.5px">Installa QuoteFollow</div>'+
        '<div style="color:var(--muted);font-size:12px;margin-top:1px">Accesso più rapido, a schermo intero, come un\'app vera.</div>'+
      '</div>'+
      '<button class="btn btn-primary btn-sm" data-action="install-app" style="flex:0 0 auto">Installa</button>')
    : ('<div style="flex:1;min-width:0">'+
        '<div style="font-weight:800;font-size:13.5px">Installa QuoteFollow</div>'+
        '<div style="color:var(--muted);font-size:12px;margin-top:1px">Tocca <b>Condividi</b> in Safari, poi <b>Aggiungi a Home</b>.</div>'+
      '</div>');
  return '<div class="card pad" style="display:flex;align-items:center;gap:10px;margin-bottom:10px;border-left:3px solid var(--primary)">'+
    body+
    '<button class="btn btn-ghost btn-sm" data-action="dismiss-install-banner" aria-label="Chiudi">✕</button>'+
  '</div>';
}
function dismissInstallBanner(){
  settings.installBannerDismissed=true;
  saveData();
  if(currentView==='oggi') renderOggi();
}
window.addEventListener('beforeinstallprompt',(e)=>{
  e.preventDefault();
  deferredInstallPrompt=e;
  if(currentView==='oggi') renderOggi();
  else if(currentView==='impostazioni') renderImpostazioni();
});
window.addEventListener('appinstalled',()=>{
  deferredInstallPrompt=null;
  toast('QuoteFollow installata');
  if(currentView==='oggi') renderOggi();
  else if(currentView==='impostazioni') renderImpostazioni();
});
async function installApp(){
  if(!deferredInstallPrompt){toast('Installazione non disponibile in questo momento');return;}
  deferredInstallPrompt.prompt();
  const choice=await deferredInstallPrompt.userChoice;
  deferredInstallPrompt=null;
  if(currentView==='impostazioni') renderImpostazioni();
  if(choice && choice.outcome==='accepted') toast('Installazione avviata');
}
function installCardHTML(){
  if(isStandalone()){
    return '<div class="card pad"><div style="font-weight:700;font-size:14px;margin-bottom:4px">App già installata</div>'+
      '<div style="color:var(--muted);font-size:12.5px">Stai usando QuoteFollow come app, dalla schermata Home.</div></div>';
  }
  if(deferredInstallPrompt){
    return '<div class="card pad">'+
      '<div style="color:var(--muted);font-size:12.5px;margin-bottom:11px">Installa QuoteFollow sul dispositivo per aprirla come un\'app, a schermo intero e senza barra del browser.</div>'+
      '<button class="btn btn-primary btn-block" data-action="install-app">Installa QuoteFollow</button>'+
    '</div>';
  }
  if(isIOS()){
    return '<div class="card pad"><div style="color:var(--muted);font-size:12.5px">Su iPhone/iPad: tocca <b>Condividi</b> nella barra di Safari, poi <b>Aggiungi a Home</b>.</div></div>';
  }
  return '<div class="card pad"><div style="color:var(--muted);font-size:12.5px">Apri il menu del browser e cerca "Installa app" o "Aggiungi a schermata Home".</div></div>';
}

function hideBootScreen(){

function showLoginScreen(show){
  const el=document.getElementById('login-screen');

function showLoginError(msg){
  const el=document.getElementById('login-error');
  if(!el) return;
  if(msg){el.textContent=msg;el.style.display='block';}
  else{el.style.display='none';}
  if(msg) showLoginInfo(null);

function showLoginInfo(msg){

}
document.getElementById('login-btn').addEventListener('click',()=>{
  showLoginError(null);
  const provider=new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).catch(e=>{
    console.warn('Login fallito',e);
    if(e.code==='auth/popup-blocked'||e.code==='auth/cancelled-popup-request'){
      // Fallback: alcuni browser mobile bloccano i popup, uso il redirect.
      auth.signInWithRedirect(provider).catch(e2=>showLoginError('Accesso non riuscito: '+e2.message));
    }else if(e.code!=='auth/popup-closed-by-user'){
      showLoginError('Accesso non riuscito: '+e.message);
    }
  });
});

/* ---------- Login via email (link magico, senza password) ---------- */
const EMAIL_FOR_SIGNIN_KEY='quotefollow_email_for_signin';
document.getElementById('email-login-btn').addEventListener('click',async()=>{
  showLoginError(null); showLoginInfo(null);
  const emailInput=document.getElementById('login-email');
  const email=(emailInput.value||'').trim();
  if(!email||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    showLoginError('Inserisci un indirizzo email valido');
    return;
  }
  const actionCodeSettings={
    url:window.location.href.split('?')[0].split('#')[0],
    handleCodeInApp:true
  };
  try{
    await auth.sendSignInLinkToEmail(email,actionCodeSettings);
    window.localStorage.setItem(EMAIL_FOR_SIGNIN_KEY,email);
    showLoginInfo('Ti abbiamo mandato un link di accesso a '+email+'. Aprilo da questo dispositivo per accedere.');
  }catch(e){
    console.warn('Invio link fallito',e);
    showLoginError('Invio non riuscito: '+e.message);
  }
});
/* Al caricamento, controlla se l'URL corrente è un link di accesso via email
   (l'utente ha cliccato il link ricevuto via mail) e completa l'accesso. */
async function completeEmailLinkSignInIfPresent(){
  if(!auth.isSignInWithEmailLink(window.location.href)) return;
  let email=window.localStorage.getItem(EMAIL_FOR_SIGNIN_KEY);
  if(!email){
    // Caso raro: link aperto su un dispositivo/browser diverso da quello che
    // ha richiesto l'accesso. Chiediamo di reinserire l'email per conferma.
    email=window.prompt('Conferma la tua email per completare l\'accesso:');
  }
  if(!email) return;
  try{
    await auth.signInWithEmailLink(email,window.location.href);
    window.localStorage.removeItem(EMAIL_FOR_SIGNIN_KEY);
    // Ripulisce l'URL dai parametri del link magico
    window.history.replaceState({},document.title,window.location.pathname);
  }catch(e){
    console.warn('Accesso via link fallito',e);
    showLoginError('Link non valido o scaduto: '+e.message);
  }
}
completeEmailLinkSignInIfPresent();
